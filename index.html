
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f4ef">
  <title>Rumah Undangan | Undangan Digital</title>
  <meta name="description" content="Rumah Undangan - Layanan undangan digital elegan untuk hari istimewa Anda.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #faf7f2;
      color: #493b35;
    }
    header {
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }
    .logo { font-size: 22px; font-weight: bold; }
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(38px, 7vw, 68px);
      margin-bottom: 20px;
    }
    .hero p {
      max-width: 500px;
      line-height: 1.8;
      color: #84746b;
    }
    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      border-radius: 30px;
      background: #9d796b;
      color: white;
      text-decoration: none;
    }
    footer {
      padding: 25px;
      text-align: center;
      color: #9a8a80;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Rumah Undangan</div>
  </header>

  <main class="hero">
    <h1>Awali Cerita Indahmu</h1>
    <p>
      Bagikan momen istimewamu melalui undangan digital
      yang elegan, berkesan, dan mudah dibagikan.
    </p>
    <a href="#tentang" class="button">Jelajahi Rumah Undangan</a>
  </main>

  <footer id="tentang">
    © 2026 Rumah Undangan. All Rights Reserved.
  </footer>
</body>
</html>
